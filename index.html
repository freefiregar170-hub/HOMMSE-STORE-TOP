<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOMMSE STORE TOP1</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f3f4f6;
color:#111827
}
header{
background:#111827;
color:white;
text-align:center;
padding:22px 15px
}
header h1{margin:0;font-size:24px}
header p{margin:8px 0 0;color:#d1d5db}
main{max-width:900px;margin:auto;padding:15px}
.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:15px;
box-shadow:0 3px 15px #0000000d
}
.balance{
display:flex;
justify-content:space-between;
align-items:center
}
.balance strong{font-size:22px}
.tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px
}
.tab{
border:0;
border-radius:12px;
padding:14px;
font-size:16px;
font-weight:bold;
background:#e5e7eb;
cursor:pointer
}
.tab.active{background:#111827;color:white}
.section{display:none}
.section.active{display:block}
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}
.product{
border:1px solid #e5e7eb;
border-radius:13px;
padding:14px
}
.product h3{
margin:0 0 10px;
font-size:15px
}
.price{
font-size:17px;
font-weight:bold;
margin-bottom:10px
}
.buy{
width:100%;
border:0;
border-radius:10px;
padding:11px;
background:#16a34a;
color:white;
font-weight:bold;
font-size:14px;
cursor:pointer
}
label{
display:block;
font-weight:bold;
margin:10px 0 6px
}
input{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:15px
}
.note{
font-size:13px;
color:#6b7280;
margin-top:8px
}
footer{
text-align:center;
padding:20px;
color:#6b7280;
font-size:13px
}
@media(max-width:600px){
.products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>HOMMSE STORE TOP1</h1>
<p>متجر شحن الألعاب والأرصدة</p>
</header>

<main>

<div class="card balance">
<div>
<div>رصيدك</div>
<strong id="balance">0</strong>
</div>
<div>ل.س</div>
</div>

<div class="tabs">
<button class="tab active" id="ffTab" onclick="showGame('freefire')">
🔥 Free Fire
</button>

<button class="tab" id="pubgTab" onclick="showGame('pubg')">
🎮 PUBG
</button>
</div>

<div class="card">

<h2>بيانات اللاعب</h2>

<label for="playerId">معرف اللاعب</label>
<input id="playerId" type="text" placeholder="أدخل ID اللاعب">

<label for="server">السيرفر</label>
<input id="server" type="text" placeholder="أدخل السيرفر">

<div class="note">
أدخل بيانات اللاعب قبل الشراء.
</div>

</div>

<section id="freefire" class="section active">
<div class="card">
<h2>🔥 منتجات فري فاير</h2>
<div id="freefireProducts" class="products"></div>
</div>
</section>

<section id="pubg" class="section">
<div class="card">
<h2>🎮 منتجات PUBG</h2>
<div id="pubgProducts" class="products"></div>
</div>
</section>

</main>

<footer>
© 2026 HOMMSE STORE TOP1
</footer>

<script>

const products = {

freefire:[
["100 جوهرة",140],
["200 جواهر",280],
["500 جواهر",700],
["1060 جواهر",1400],
["2180 جواهر",2700],
["عضوية أسبوعية",350],
["عضوية أسبوعية دبل",650],
["عضوية شهرية",1600],
["حزمة مستوى 6",100],
["حزمة مستوى 10",140],
["حزمة مستوى 15",140],
["حزمة مستوى 20",140],
["حزمة مستوى 25",140],
["حزمة مستوى 30",160]
],

pubg:[
["60 شدة",140],
["325 شدة",700],
["660 شدة",1300],
["1800 شدة",3200],
["حزمة شراء أول",140],
["حزمة ترقية الأسلحة النارية",400],
["حزمة إشعار الخرافي",650],
["Prime شهر 1",140],
["Prime شهر 3",400],
["Prime شهر 6",780],
["Prime شهر 12",1300],
["حزمة صفقات أسبوعية",140],
["حزمة صفقات أسبوعية 2",400]
]

};

function renderProducts(game,id){

const box=document.getElementById(id);

box.innerHTML="";

products[game].forEach(function(item,index){

const div=document.createElement("div");

div.className="product";

div.innerHTML=
"<h3>"+item[0]+"</h3>"+
"<div class='price'>"+item[1]+" ل.س</div>"+
"<button class='buy' onclick=\"buy('"+game+"',"+index+")\">شراء</button>";

box.appendChild(div);

});

}

function showGame(game){

document.getElementById("freefire").classList.remove("active");
document.getElementById("pubg").classList.remove("active");

document.getElementById("ffTab").classList.remove("active");
document.getElementById("pubgTab").classList.remove("active");

if(game==="freefire"){

document.getElementById("freefire").classList.add("active");
document.getElementById("ffTab").classList.add("active");

}else{

document.getElementById("pubg").classList.add("active");
document.getElementById("pubgTab").classList.add("active");

}

}

function buy(game,index){

const player=document.getElementById("playerId").value.trim();
const server=document.getElementById("server").value.trim();

if(!player){
alert("يرجى إدخال معرف اللاعب.");
return;
}

if(!server){
alert("يرجى إدخال السيرفر.");
return;
}

const product=products[game][index];

alert(
"المنتج: "+product[0]+
"\nالسعر: "+product[1]+" ل.س"+
"\nID اللاعب: "+player+
"\nالسيرفر: "+server
);

}

renderProducts("freefire","freefireProducts");
renderProducts("pubg","pubgProducts");

</script>

</body>
</html>
